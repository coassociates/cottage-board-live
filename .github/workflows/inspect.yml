name: Inspect KDS tickets

# Diagnostic, run by hand only. Prints today's Counter Expeditor ticket times (no names, ids
# or money) and a trial live.json counter block, without publishing anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Today's Counter Expeditor tickets (times and sources only)
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ vars.SQUARE_LOCATION_ID || 'L6NP58MH414CM' }}
          KDS_STATION_NAME: ${{ vars.KDS_STATION_NAME || 'Counter Expeditor' }}
        run: python live_poller.py --inspect
      - name: Build live.json without publishing
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ vars.SQUARE_LOCATION_ID || 'L6NP58MH414CM' }}
          KDS_STATION_NAME: ${{ vars.KDS_STATION_NAME || 'Counter Expeditor' }}
          WEATHER_PROVIDER: open-meteo
        run: python live_poller.py --out /tmp/live.json && python -c "import json; print(json.dumps(json.load(open('/tmp/live.json'))['counter'], indent=1))"
